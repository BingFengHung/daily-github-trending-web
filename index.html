 <!DOCTYPE html>
    <html lang="zh-TW">
    <head>
      <meta charset="UTF-8">
      <title>🚀 GitHub Trending 每日 AI 報告儀表板</title>
      <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
      <meta name="description" content="每日 GitHub 熱門技術與 AI 精選解讀儀表板">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

      <!-- PWA 標籤設定 -->
      <link rel="manifest" href="manifest.json">
      <meta name="theme-color" content="#42b983">
      <meta name="apple-mobile-web-app-capable" content="yes">
      <meta name="apple-mobile-web-app-status-bar-style" content="default">
      <meta name="apple-mobile-web-app-title" content="AI 科技日報">

      <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    </head>
    <body>
      <div id="app">🚀 正在載入每日 AI 報告儀表板...</div>

      <script>
        window.$docsify = {
          name: '🚀 GitHub Trending 每日 AI 報告',
          repo: 'https://github.com/BingFengHung/daily-github-trending-web',
          loadSidebar: true,
          autoHeader: true,
          subMaxLevel: 3,
          homepage: 'README.md',
          search: {
            maxAge: 86400000,
            paths: 'auto',
            placeholder: '🔍 搜尋技術關鍵字、Repo 名稱或語言...',
            noData: '找不到相關報告！',
            depth: 6
          }
        }
      </script>

      <!-- PWA Service Worker 註冊指令 -->
      <script>
        if (typeof navigator.serviceWorker !== 'undefined') {
          navigator.serviceWorker.register('sw.js');
        }
      </script>

      <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
      <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
      <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
    </body>
    </html>
