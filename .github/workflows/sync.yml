name: Sync Daily Report from Private Repo

on:
  schedule:
    # 每天早上 07:45 執行 (在 Cloudflare 07:30 產出後 15 分鐘觸發)
    - cron: '17 02 * * *'
    - cron: '43 04 * * *'
  workflow_dispatch: # 支援手動按鈕觸發

jobs:
  sync-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Public Repo
        uses: actions/checkout@v4

      - name: Checkout Private Repo
        uses: actions/checkout@v4
        with:
          repository: 'BingFengHung/daily-github-trending'
          token: ${{ secrets.MY_PATH_TOKEN }}
          path: 'private-repo'

      - name: Copy Today's Report & Update Sidebar
        run: |
          mkdir -p reports
          TODAY=$(date +%Y-%m-%d)
          SOURCE_REPORT="private-repo/reports/${TODAY}.md"
          TARGET_REPORT="reports/${TODAY}.md"

          if [ ! -f "$SOURCE_REPORT" ]; then
           echo "⚠️ 在 Private Repo 中未找到今日報告: ${SOURCE_REPORT}，跳過同步。"
            rm -rf private-repo
            exit 0
          fi

          echo "[1/3] 找到今日報告，複製至 Public Repo..."
          cp "$SOURCE_REPORT" "$TARGET_REPORT"
          rm -rf private-repo

          echo "[2/3] 自動更新 Docsify 側邊欄 (_sidebar.md)..."
          if [ ! -f _sidebar.md ]; then
            echo "* 📌 **首頁與說明**" > _sidebar.md
            echo "  * [專案簡介](README.md)" >> _sidebar.md
            echo "" >> _sidebar.md
            echo "* 📅 **每日技術報告**" >> _sidebar.md
          fi

          if ! grep -q "${TODAY}.md" _sidebar.md; then
            echo "* 📌 **首頁與說明**" > temp_sidebar.md
            echo "  * [專案簡介](README.md)" >> temp_sidebar.md
            echo "" >> temp_sidebar.md
            echo "* 📅 **每日技術報告**" >> temp_sidebar.md
            echo "  * [${TODAY} 報告](reports/${TODAY}.md)" >> temp_sidebar.md
            grep "reports/ _sidebar.md | grep -v "${TODAY}.md" >> temp_sidebar.md || true
            mv temp_sidebar.md _sidebar.md
          fi

          echo "[3/3] 提交變更至 Public Repo..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"
          git add reports/ _sidebar.md
          git commit -m "docs: auto sync daily report (${TODAY})" || exit 0
          git push

