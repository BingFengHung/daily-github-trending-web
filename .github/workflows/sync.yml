    name: Sync Daily Report from Private Repo

    on:
      schedule:
        # 每天早上 07:45 執行 (在 Cloudflare 07:30 產出後 15 分鐘觸發)
        - cron: '45 23 * * *'
      workflow_dispatch: # 支援手動按鈕觸發

    jobs:
      sync-report:
        runs-on: ubuntu-latest
        permissions:
          contents: write
        steps:
          - name: Checkout Public Repo
            uses: actions/checkout@v4

          - name: Sync Today's Report & Update Sidebar
            env:
              PAT_TOKEN: ${{ secrets.MY_PAT_TOKEN }}
            run: |
              mkdir -p reports
              TODAY=$(date +%Y-%m-%d)
              REPORT_PATH="reports/${TODAY}.md"

              echo "[1/3] 嘗試從 Private Repo REST API 抓取最新報告: ${REPORT_PATH}"

              # Classic PAT 使用 token 標頭
              HTTP_STATUS=$(curl -s -o "${REPORT_PATH}" -w "%{http_code}" \
                -H "Authorization: token ${PAT_TOKEN}" \
                -H "Accept: application/vnd.github.v3.raw" \
                -L "https://api.github.com/repos/BingFengHung/daily-github-trending/contents/${REPORT_PATH}")

              echo "🔍 測試結果 HTTP 狀態碼為: ${HTTP_STATUS}"

              if [ "$HTTP_STATUS" -ne 200 ]; then
                echo "❌ 抓取失敗 (HTTP ${HTTP_STATUS})，GitHub 回傳訊息："
                cat "${REPORT_PATH}"
                rm -f "${REPORT_PATH}"
                exit 1
              fi

              echo "[2/3] 報告抓取成功！自動更新 Docsify 側邊欄 (_sidebar.md)..."

              # 初始化 _sidebar.md (若不存在)
              if [ ! -f _sidebar.md ]; then
                echo "* 📌 **首頁與說明**" > _sidebar.md
                echo "  * [專案簡介](README.md)" >> _sidebar.md
                echo "" >> _sidebar.md
                echo "* 📅 **每日技術報告**" >> _sidebar.md
              fi

              # 檢查是否已記錄過今天的報告，若無則插入頂部
              if ! grep -q "${TODAY}.md" _sidebar.md; then
                echo "* 📌 **首頁與說明**" > temp_sidebar.md
                echo "  * [專案簡介](README.md)" >> temp_sidebar.md
                echo "" >> temp_sidebar.md
                echo "* 📅 **每日技術報告**" >> temp_sidebar.md
                echo "  * [${TODAY} 報告](reports/${TODAY}.md)" >> temp_sidebar.md
                grep "  * \[" _sidebar.md | grep -v "README.md" >> temp_sidebar.md || true
                mv temp_sidebar.md _sidebar.md
              fi

              echo "[3/3] 提交變更至 Public Repo..."
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]"
              git add reports/ _sidebar.md
              git commit -m "docs: auto sync daily report (${TODAY})" || exit 0
              git push
